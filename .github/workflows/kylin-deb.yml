# =============================================================================
# 麒麟 / 飞腾 / 鲲鹏 aarch64 —— 只出 deb（Tauri 1.x）
# =============================================================================
#
# 为什么单独开一个工作流，而不是直接用 release.yml：
#   release.yml 是全平台矩阵（Windows + macOS×2 + Linux×2）。首次迁移到
#   Tauri 1.x 的构建大概率还要踩几个坑，每次重试都跑 5 个平台既慢又互相干扰
#   （尤其 Windows 的 NSIS 签名、macOS 的 cross target 与目标无关）。
#   目标机只要 aarch64 deb，就单独构建一个快速迭代通道。
#
# 触发：推送 kylin-deb-* 标签，或在 Actions 页面手动 Run workflow
#   git tag kylin-deb-20261019-4
#   git push origin kylin-deb-20261019-4
#
# 🔴 为什么必须用 ubuntu-22.04-arm（不能用 24.04）：
#    Tauri 1.x 依赖 libwebkit2gtk-**4.0**-dev；Ubuntu 24.04 (noble) 已移除该
#    开发包（只剩 4.0 运行时库）。jammy (22.04) 同时提供 4.0/4.1 两套 dev 包，
#    官方支持到 2027-04。且目标机麒麟 V10 GFB 只有 4.0 运行时，
#    编译侧必须对齐同一 ABI，否则链出 4.1 依赖照样装不上。
#
# 🔴 为什么每个失败步骤都要发 ::error:: 注解（run 3 的教训）：
#    Actions 日志下载、artifact 下载都要认证，本机没有可用 token。
#    免认证能读的只有：run/job/step 状态、artifacts 列表、
#    **check-run annotations**（/repos/{o}/{r}/check-runs/{id}/annotations）。
#    所以让 CI 把失败摘要自己写成注解，重跑后直接读注解就能定位，不必猜。
#    注意：workflow command 的多行消息必须把换行编码成 %0A，
#    否则只有第一行会成为注解、其余沦为普通输出（下面的 annotate() 处理）。
# =============================================================================

name: Kylin Deb (aarch64)

on:
  push:
    tags:
      - 'kylin-deb-*'
  workflow_dispatch:

jobs:
  build-deb:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Linux system dependencies (webkit2gtk-4.0 for Tauri 1.x)
        run: |
          sudo apt-get update
          # 🔴 libappindicator3-dev 与 libayatana-appindicator3-dev 在 Ubuntu
          #    22.04 上互相 Conflicts，不能共存（run 7 实锤：
          #    "libayatana-appindicator3-dev : Conflicts: libappindicator3-dev"）。
          #    而且编译期根本不需要任何 appindicator dev 包：
          #    tauri-runtime-wry → tao → libappindicator → libappindicator-sys
          #    是纯 dlopen（无 build.rs、无 pkg-config）。dev 包只为
          #    TAURI_TRAY=appindicator 时 tauri-cli 打包期的探测提供
          #    appindicator3-0.1.pc（见下面 TAURI_TRAY 注释），所以只装
          #    libappindicator3-dev，不装 ayatana 的。
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libjavascriptcoregtk-4.0-dev \
            libsoup2.4-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # cache-on-failure: true —— run 3 的教训：job 在 deb 打包步骤失败，
      # 而 swatinem/rust-cache 默认失败轮不存缓存，导致重跑又全量冷编
      # （lto=true + codegen-units=1，一轮 8-10 分钟）。打开后失败轮也留缓存。
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          cache-on-failure: true

      - name: Install frontend dependencies
        run: pnpm install

      # ─── 为什么临时关掉 updater ─────────────────────────────────────────
      # tauri.conf.json 里 tauri.updater.active = true。Tauri 1.x 在 updater
      # 开启时会尝试给更新包签名，需要 TAURI_SIGNING_PRIVATE_KEY；
      # 本仓库**没有配置该 secret**，会让 bundle 阶段直接失败
      # （tauri-cli build.rs: "A public key has been found, but no private key"）。
      #
      # 这里构建的是"能装上、能跑"的目标产物，故先关掉 updater。
      # 代价：这个 deb 装出来的应用不具备自动更新能力。
      #
      # 若要恢复自动更新，两条路之一：
      #   1) 在仓库 Secrets 配上与 tauri.conf.json 里 updater.pubkey 匹配的
      #      TAURI_SIGNING_PRIVATE_KEY / _PASSWORD，然后删掉本步骤；
      #   2) 或把 updater.pubkey 换成自己生成的公钥再配私钥。
      # 二者必须配套，否则应用会拒绝安装来源不明的更新。
      #
      # 🔴 只改 conf 不够，必须同步摘掉 Cargo.toml 里 tauri 的 "updater" feature：
      #    tauri-build 的 allowlist 校验（tauri-build/src/allowlist.rs::check，
      #    由 build() 在 line 432 调用）要求 Cargo features 与 tauri.conf.json
      #    **精确一一对应**。tauri-utils 的 TauriConfig::features() 只在
      #    `updater.active == true` 时才产出 "updater"：
      #        if self.updater.active { features.push("updater"); }
      #    于是 conf 关掉、Cargo.toml 还开着 → features_diff 报
      #        The `tauri` dependency features on the `Cargo.toml` file does not
      #        match the allowlist defined under `tauri.conf.json`.
      #        ... remove the `updater` feature
      #    build() 收到 Err 后直接 std::process::exit(1) → cargo build 失败。
      #    （kylin-v1-check.yml 不碰 conf，所以从来撞不到这条。）
      - name: Temporarily disable updater (no signing key configured)
        run: |
          jq '.tauri.updater.active = false' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          # 同步摘 feature。行格式已核实唯一（Cargo.toml:102 `  "updater",`），
          # 锚定行首行尾防误伤；Cargo.lock 不记录 feature，故无需重新生成锁。
          sed -i '/^  "updater",$/d' src-tauri/Cargo.toml
          echo "updater.active = $(jq '.tauri.updater.active' src-tauri/tauri.conf.json)"
          if grep -n '^  "updater",$' src-tauri/Cargo.toml; then
            echo "::error::Cargo.toml 的 updater feature 未摘除，build.rs 的 allowlist 校验必失败"
            exit 1
          else
            echo "Cargo.toml 的 updater feature 已摘除"
          fi

      # kb-mcp sidecar：必须在 tauri build 之前生成。
      # tauri.conf.json 的 bundle.externalBin 写的是 "binaries/kb-mcp"，
      # Tauri 会按当前 target triple 展开成 binaries/kb-mcp-aarch64-unknown-linux-gnu，
      # 找不到就报 "path matching binaries/kb-mcp-aarch64-unknown-linux-gnu not found."。
      # 本机 runner 就是 aarch64，故不需要 --target（走 host triple）。
      - name: Build kb-mcp sidecar
        run: pnpm build:mcp

      # ─── 为什么拆成 3 步，而不是一句 `pnpm tauri build` ──────────────
      # `tauri build` 内部依次做三件事：跑 beforeBuildCommand（vite build）→
      # cargo build --release → bundle。任何一步失败，对外只表现为
      # 「Build deb 这一步红了」，无法判断是前端、Rust 还是打包器的问题。
      # 而 CI 日志下载需要认证（免认证只能拿到步骤结论 + 注解）。
      # 拆开后，失败落在哪一步直接从步骤颜色就能读出来；同时每步失败时
      # 把摘要写成 ::error:: 注解，重跑后读注解即可拿到真实报错。
      # ------------------------------------------------------------------

      - name: Build step 1/3 — 前端构建（beforeBuildCommand）
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: pnpm build

      # 🔴 为什么这里要加 --features custom-protocol：
      #    tauri-cli 的 AppInterface::build() 会无条件 push("custom-protocol")
      #    （interface/rust.rs:176），最终以
      #        cargo build --release --features custom-protocol
      #    调用 cargo（desktop.rs::build_command:285-292）。
      #    如果本步用裸 `cargo build --release`，下一步 `tauri build` 的 cargo
      #    调用会因为 feature 集合不同而**整个 tauri 依赖链全部重编**——
      #    本项目 lto=true + codegen-units=1，一轮 fat-LTO 要 8-10 分钟。
      #    参数对齐后，下一步的 cargo 是纯 no-op，失败排查与整体耗时都受益。
      #    custom-protocol 只经命令行传入、不进 Cargo.toml，
      #    不影响 tauri-build 的 allowlist 校验（该校验只看 Cargo.toml vs conf）。
      - name: Build step 2/3 — Rust release 编译（主程序）
        working-directory: src-tauri
        run: |
          set +e
          cargo build --release --features custom-protocol > /tmp/cargo.log 2>&1
          STATUS=$?
          set -e

          # 剥离 ANSI：环境若带 CARGO_TERM_COLOR=always，行首会是 \033[31m，
          # `grep "^error"` 永远匹配不到，会误报成「失败但 0 错误」。
          sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/cargo.log

          echo "===== cargo build --release 退出码: ${STATUS} ====="
          echo "===== error 行数: $(grep -c '^error' /tmp/cargo.log || true) ====="
          echo ""
          echo "===== 错误详情（每条带 12 行上下文）====="
          grep -E -A12 '^error(\[[A-Z0-9]+\])?(:|\[)' /tmp/cargo.log | head -240 || true
          echo ""
          echo "===== 最后 60 行 ====="
          tail -60 /tmp/cargo.log

          if [ ${STATUS} -ne 0 ]; then
            # 免认证读日志的唯一通道：把失败摘要写成 check-run 注解。
            # annotate() 负责把多行文本编码成单行 workflow command
            # （% → %25 先行转义，换行 → %0A；否则只有第一行会成为注解）。
            annotate() {
              sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'
            }
            MSG=$( {
              echo "[rust-build] cargo build --release 失败，退出码 ${STATUS}"
              grep -E -A8 '^error(\[[A-Z0-9]+\])?(:|\[)' /tmp/cargo.log | head -80
              echo "----- 日志最后 50 行 -----"
              tail -50 /tmp/cargo.log
            } | annotate )
            echo "::error::${MSG}"
          fi
          exit ${STATUS}

      - name: Build step 3/3 — Tauri 打包 deb
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
          # 🔴 麒麟 V10 装不上 deb 的根因与修法（2026-10-19 目标机实测报错实锤）：
          #    「knowledge-base依赖关系不满足libayatana-appindicator3-1」
          # 机制（tauri-cli 1.6.6 源码实锤，src/interface/rust.rs:1092-1099）：
          #    有系统托盘配置时，tauri-cli 自动往 deb 的 Depends 推包名，
          #    默认推 libayatana-appindicator3-1：
          #      let tray = std::env::var("TAURI_TRAY").unwrap_or("ayatana");
          #      if tray == "ayatana" { depends_deb.push("libayatana-appindicator3-1") }
          #      else                   { depends_deb.push("libappindicator3-1") }
          #    麒麟 V10 是 focal(20.04) 底，仓库只有 libappindicator3-1；
          #    libayatana-appindicator3-1 要 Ubuntu 21.04+/Debian 11 才有。
          # 🔴 这只是**元数据层**的包名，不影响二进制本身：
          #    libappindicator-sys 0.7.3 是运行时 dlopen（Library::new，
          #    src/lib.rs:13-55）：先试 libayatana-appindicator3.so.1，
          #    失败回退 libappindicator3.so.1。所以麒麟装 libappindicator3-1
          #    后，托盘经回退路径正常工作，无需任何符号链接 hack。
          #    设成 appindicator 只是让 Depends 写上麒麟认识的包名，
          #    dpkg -i 一把过；运行时若目标机有 ayatana 仍优先用它。
          # 🔴 二阶效应（run 6 踩坑，tauri-cli src/build.rs:248-272 实锤）：
          #    TAURI_TRAY != "ayatana" 时，tauri-cli 在**打包阶段**还会
          #    用 pkg-config 探测 appindicator3-0.1 模块来设
          #    TRAY_LIBRARY_PATH（只被 AppImage 模板用，deb 不碰），
          #    探测不到就 expect panic：
          #      get_library_path("appindicator3-0.1")
          #        .expect("failed to get libappindicator-gtk library
          #                 path using pkg-config.")
          #    所以 CI 要装 libappindicator3-dev（提供 appindicator3-0.1.pc）。
          #    注意它和 libayatana-appindicator3-dev 在 Ubuntu 22.04 上
          #    Conflicts 不能共存，且编译期两者都不需要（dlopen），
          #    故只装前者。该 panic 在分离线程里，退出码仍是 0——
          #    run 6 因此静默失败（步骤绿但无 deb），靠 Locate deb 兜底
          #    才暴露；现已在步骤内加产物断言。
          TAURI_TRAY: appindicator
        run: |
          set +e
          # --verbose：打包器的报错（资源缺失 / dpkg 调用 / 图标）比
          # 默认输出详细得多，是这里最可能失败的一环。
          pnpm tauri build --bundles deb --verbose > /tmp/build.log 2>&1
          STATUS=$?
          set -e

          sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/build.log

          echo "===== tauri build 退出码: ${STATUS} ====="
          echo "===== error 行数: $(grep -c '^error' /tmp/build.log || true) ====="
          echo ""
          echo "===== error 详情（每条带 12 行上下文）====="
          grep -E -A12 '^error(\[[A-Z0-9]+\])?(:|\[)' /tmp/build.log | head -240 || true
          echo ""
          echo "===== 最后 80 行（看卡在哪一步）====="
          tail -80 /tmp/build.log

          # 失败时把 bundle 目录的状态也打出来：能区分"没进打包器"和
          # "进打包器后挂了"两种情况。
          if [ ${STATUS} -ne 0 ]; then
            echo ""
            echo "===== bundle 目录现状 ====="
            find src-tauri/target/release/bundle -maxdepth 2 -exec ls -ld {} \; 2>/dev/null || echo "(bundle 目录为空或不存在)"
            echo "===== 主程序产物（knowledge_base vs knowledge-base）====="
            ls -la src-tauri/target/release/ 2>/dev/null | grep -i knowledge || echo "(target/release 下无 knowledge* 产物)"
            echo "===== sidecar 产物 ====="
            ls -la src-tauri/binaries/ 2>/dev/null || echo "(sidecar 未生成)"
            echo "===== Cargo.toml 累计改动（sed 摘 updater + rewrite_manifest）====="
            git -C src-tauri diff -- Cargo.toml | head -40 || true

            # 免认证读日志的唯一通道：把失败摘要写成 check-run 注解。
            # annotate() 负责把多行文本编码成单行 workflow command
            # （% → %25 先行转义，换行 → %0A；否则只有第一行会成为注解）。
            annotate() {
              sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'
            }
            MSG=$( {
              echo "[deb-bundle] tauri build 失败，退出码 ${STATUS}"
              echo "----- bundler/打包相关行 -----"
              grep -E -i 'bundle|dpkg|icon|resource|failed|panic|not found|caused by' /tmp/build.log | tail -40
              echo "----- error 行（带上下文）-----"
              grep -E -A8 '^error(\[[A-Z0-9]+\])?(:|\[)' /tmp/build.log | head -60
              echo "----- 日志最后 60 行 -----"
              tail -60 /tmp/build.log
              echo "----- target/release 主程序产物 -----"
              ls -la src-tauri/target/release/ 2>/dev/null | grep -i knowledge || echo "(无 knowledge* 产物)"
              echo "----- bundle 目录 -----"
              find src-tauri/target/release/bundle -maxdepth 2 2>/dev/null || echo "(bundle 目录为空或不存在)"
              echo "----- 打包器输入预检 -----"
              for p in \
                src-tauri/binaries/kb-mcp-aarch64-unknown-linux-gnu \
                src-tauri/resources/pdfium/pdfium.dll \
                src-tauri/resources/ocr/RapidOCR-json.exe \
                src-tauri/icons/32x32.png \
                src-tauri/icons/128x128.png \
                src-tauri/icons/128x128@2x.png; do
                if [ -e "$p" ]; then echo "OK   $p"; else echo "MISS $p"; fi
              done
              echo "----- Cargo.toml diff -----"
              git -C src-tauri diff -- Cargo.toml | head -30 || true
            } | annotate )
            echo "::error::${MSG}"
          fi

          if [ ${STATUS} -eq 0 ]; then
            # 成功时把 deb 的控制字段写成 ::notice:: 注解——免认证可读
            # （check-runs annotations API 返回全部 level），不必下载 51 MB
            # 就能确认 Depends 已经是麒麟 V10 认识的包名。
            # 重点核对 Depends 里是 libappindicator3-1 而不是
            # libayatana-appindicator3-1（TAURI_TRAY 是否生效的直接证据）。
            #
            # 🔴 退出码 0 ≠ 打包成功（run 6 实锤的静默失败）：
            #    tauri-cli 打包阶段设 TRAY_LIBRARY_PATH 的 pkg-config 探测
            #    失败时，panic 发生在**分离线程**（日志里 thread '<unnamed>'
            #    panicked），不搞崩进程——pnpm 拿到退出码 0、步骤显示
            #    success，但 deb 根本没产出。所以这里必须做产物断言：
            #    退出 0 却找不到 .deb，一律判失败并报警解。
            annotate() {
              sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'
            }
            DEB=$(ls src-tauri/target/release/bundle/deb/*.deb 2>/dev/null | head -1)
            if [ -z "${DEB}" ]; then
              echo "::error::[deb-bundle] tauri build 退出码 0 但未产出 .deb —— 疑似打包阶段静默失败，请查 /tmp/build.log 末尾的 panic"
              exit 1
            fi
            MSG=$( {
              echo "[deb-bundle] 打包成功，deb 控制字段："
              dpkg-deb -f "${DEB}" Package Version Architecture Depends Installed-Size
              echo "文件: $(basename "${DEB}") ($(stat -c %s "${DEB}") bytes)"
            } | annotate )
            echo "::notice::${MSG}"
          fi
          exit ${STATUS}

      # ─── 失败时把日志推到独立分支 + 写成注解，供免认证读取 ─────────────
      # 背景：Actions 日志与 artifact 下载都要求认证，而本机没有可用 token
      # （用户给的 PAT 已删除）。免认证能读到的只有：run 状态、job 状态、
      # 每一步的 conclusion、artifacts 列表、**check-run 注解**。
      #
      # 双通道冗余：
      #   a) 注解（主通道）：步骤 2/3、3/3 失败时已各自写入，本步再兜底一次；
      #   b) ci-debug-logs 分支（备通道）：公开仓库 contents API 免认证可读。
      #     推的是独立分支，不会污染 tauri-v1，也不会触发任何工作流
      #     （kylin-v1-check.yml 只监听 tauri-v1 分支且带 paths 过滤，
      #      kylin-deb.yml 只监听 tag）。
      #
      # 🔴 本步骤**永不许失败**（run 3 的教训）：它自己失败会盖住真实失败的
      #    信号。历史上两个坑都修掉：
      #     1) `[ -s "$f" ] && sed ...` 在 GitHub Actions 默认 bash -e 下，
      #        文件不存在/为空即使整个步骤失败 → 改成 if 包裹；
      #     2) git push 可能因 token 权限失败 → `|| echo` 兜底，不再致命。
      - name: 失败时推送日志到 ci-debug-logs 分支
        if: failure()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 日志文件名必须和上面两步的写入路径一致：
          #   Build step 2/3 → /tmp/cargo.log
          #   Build step 3/3 → /tmp/build.log
          for f in /tmp/cargo.log /tmp/build.log; do
            if [ -s "$f" ]; then
              sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' "$f"
            fi
          done

          # 注解兜底：万一前面步骤的注解写入被跳过，这里再发一次完整尾部。
          annotate() {
            sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'
          }
          if [ -s /tmp/build.log ]; then
            MSG=$( { echo "[deb-bundle-fallback] /tmp/build.log 尾部"; tail -60 /tmp/build.log; } | annotate )
            echo "::error::${MSG}"
          fi
          if [ -s /tmp/cargo.log ]; then
            MSG=$( { echo "[rust-build-fallback] /tmp/cargo.log 尾部"; tail -40 /tmp/cargo.log; } | annotate )
            echo "::error::${MSG}"
          fi

          mkdir -p .ci-logs
          TS=$(date +%Y%m%d-%H%M%S)
          for f in /tmp/cargo.log /tmp/build.log; do
            if [ -s "$f" ]; then
              cp "$f" ".ci-logs/${TS}-$(basename $f)"
            fi
          done
          if [ -z "$(ls -A .ci-logs 2>/dev/null)" ]; then
            echo "没有可推送的日志（两步都未生成 /tmp/cargo.log 或 /tmp/build.log）"
            exit 0
          fi
          git config user.name "ci-debug"
          git config user.email "ci-debug@users.noreply.github.com"
          git checkout -B ci-debug-logs
          git add -f .ci-logs
          git commit -m "ci: ${TS} 构建失败日志 (run ${{ github.run_id }})" || echo "无新内容可提交"
          git push -f origin ci-debug-logs || echo "推送 ci-debug-logs 失败（不影响结论，注解通道已有摘要）"
          echo "已推送到 ci-debug-logs 分支"

      - name: Locate deb
        id: deb
        run: |
          set -euo pipefail
          ls -la src-tauri/target/release/bundle/deb/ || true
          DEB=$(find src-tauri/target -name '*.deb' -type f | head -1)
          if [ -z "${DEB}" ]; then
            echo "❌ 未找到任何 .deb 产物"
            echo "===== bundle 目录树 ====="
            find src-tauri/target -maxdepth 4 -type d -name 'bundle*' -exec ls -la {} \; || true
            exit 1
          fi
          echo "path=${DEB}" >> "$GITHUB_OUTPUT"
          echo "✅ 产物: ${DEB}"
          ls -lh "${DEB}"
          file "${DEB}" || true

      - name: Upload deb artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kylin-aarch64-deb
          path: src-tauri/target/release/bundle/deb/*.deb
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kylin-deb-build-log
          path: |
            /tmp/build.log
            /tmp/cargo.log
          retention-days: 7
          if-no-files-found: ignore
