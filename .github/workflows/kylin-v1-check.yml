# =============================================================================
# Tauri 1.x（麒麟 glibc 2.31 适配线）编译检查
# =============================================================================
#
# 用途：只跑 `cargo check`，不打包，用于在迁移期间快速暴露 API 不兼容点。
#       完整打包仍走 release.yml。
#
# 🔴 为什么用 ubuntu-22.04-arm 而不是 24.04-arm：
#    Tauri 1.x 需要 libwebkit2gtk-4.0-dev，Ubuntu 24.04 已移除该开发包。
#    jammy 同时有 4.0/4.1，官方支持到 2027-04。
#
# 触发：手动（Actions 页面 Run workflow）或推 kylin-v1* tag
# =============================================================================

name: Kylin v1 Check

on:
  workflow_dispatch:
  push:
    branches:
      - tauri-v1
    paths:
      - 'src-tauri/**'
      - '.github/workflows/kylin-v1-check.yml'

jobs:
  check:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (webkit2gtk-4.0 for Tauri 1.x)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libjavascriptcoregtk-4.0-dev \
            libsoup2.4-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check (lib + bin)
        working-directory: ./src-tauri
        # 不用 -D warnings：迁移期先把「能不能编过」这件事确认下来，
        # warning 留到功能跑通后再逐个清理。
        #
        # 🔴 退出码必须直接取自 cargo，不能用 ${PIPESTATUS[0]}：
        #    早先写成 `cargo check | tee log` 后先跑 grep 再 exit ${PIPESTATUS[0]}，
        #    此时 PIPESTATUS 已被 grep 覆盖（grep 找到 error 返回 0），
        #    导致**编译失败却显示 job 成功**，把真实错误完全掩盖。
        #    正确做法：先把日志落盘，立即取 $?，再分析日志。
        run: |
          set +e
          cargo check --all-targets > /tmp/check.log 2>&1
          STATUS=$?
          set -e
          echo "===== cargo check 退出码: ${STATUS} ====="
          ERRORS=$(grep -c "^error" /tmp/check.log || true)
          echo "===== error 行数: ${ERRORS} ====="
          echo "===== 日志尾部 250 行（编译错误通常在此）====="
          # 🔴 必须用 tail 不是 head：依赖解析日志（Updating index / Locking N packages /
          # Downgrading ...）本身就可能几百行，用 head 会把真正的 error 全部截掉，
          # 导致「退出码 101 但 error 行数 0」的假象（已踩过一次）。
          tail -250 /tmp/check.log
          echo "===== 错误摘要（去重）====="
          grep -E "^error(\[E[0-9]+\])?:" /tmp/check.log | sed 's/ -->.*//' | sort | uniq -c | sort -rn | head -40 || true
          echo "===== 出错文件清单 ====="
          grep -oE "^\s+--> [^:]+" /tmp/check.log | sed 's/.*--> //' | sort | uniq -c | sort -rn | head -30 || true
          exit ${STATUS}
