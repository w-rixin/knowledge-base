# =============================================================================
# Tauri 1.x（麒麟 glibc 2.31 适配线）编译检查
# =============================================================================
#
# 用途：只跑 `cargo check`，不打包，用于在迁移期间快速暴露 API 不兼容点。
#       完整打包仍走 release.yml。
#
# 🔴 为什么用 ubuntu-22.04-arm 而不是 24.04-arm：
#    Tauri 1.x 需要 libwebkit2gtk-4.0-dev，Ubuntu 24.04 已移除该开发包。
#    jammy 同时有 4.0/4.1，官方支持到 2027-04。
#
# 触发：手动（Actions 页面 Run workflow）或推 kylin-v1* tag
# =============================================================================

name: Kylin v1 Check

on:
  workflow_dispatch:
  push:
    branches:
      - tauri-v1
    paths:
      - 'src-tauri/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/kylin-v1-check.yml'

jobs:
  frontend-check:
    # 前端类型与构建检查。Rust 编译已通过，但前端 API 降级（plugin-store/log/
    # autostart 在 npm 上只有 v2，已改用自写 shim）仍需 tsc 验证。
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm install
        # 注意：package.json 已降级到 Tauri 1.x 生态，lock 文件仍是旧的，
        # 因此不能加 --frozen-lockfile（会直接失败）。
        run: pnpm install
      - name: TypeScript 类型检查
        run: |
          set +e
          pnpm exec tsc --noEmit -p tsconfig.json > /tmp/tsc.log 2>&1
          ST=$?
          set -e
          sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/tsc.log
          echo "===== tsc 退出码: ${ST} ====="
          echo "===== 错误数: $(grep -cE 'error TS' /tmp/tsc.log || true) ====="
          grep -E "error TS" /tmp/tsc.log | head -60 || true
          exit $ST
      - name: Vite 构建
        run: |
          set +e
          pnpm build > /tmp/vite.log 2>&1
          ST=$?
          set -e
          sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/vite.log
          echo "===== vite 退出码: ${ST} ====="
          tail -60 /tmp/vite.log
          exit $ST
      - name: Upload frontend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-logs
          path: |
            /tmp/tsc.log
            /tmp/vite.log
          retention-days: 3
          if-no-files-found: ignore

  check:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (webkit2gtk-4.0 for Tauri 1.x)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.0-dev \
            libjavascriptcoregtk-4.0-dev \
            libsoup2.4-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            build-essential \
            file \
            patchelf

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: cargo check (lib + bin)
        working-directory: ./src-tauri
        # 不用 -D warnings：迁移期先把「能不能编过」这件事确认下来，
        # warning 留到功能跑通后再逐个清理。
        #
        # 🔴 本步骤踩过的三个坑（都是"日志分析"自身的问题，与代码无关）：
        #   1. `cargo check | tee log; grep ...; exit ${PIPESTATUS[0]}`
        #      —— PIPESTATUS 在 grep 之后已指向 grep，编译失败却显示成功。
        #      改：先落盘、立即取 $?、最后 exit $STATUS。
        #   2. `head -200 log`
        #      —— 依赖解析日志（Locking N packages / Downgrading ...）本身几百行，
        #      真正的编译错误在后面被截掉。改：不再打印全文，直接 grep 错误上下文。
        #   3. **环境带 CARGO_TERM_COLOR=always，日志含 ANSI 颜色码**
        #      —— `grep "^error"` 永远匹配不到（行首实际是 \033[31m 等转义），
        #      表现为「退出码 101、error 行数 0」，误导了整整两轮排查。
        #      改：显式 CARGO_TERM_COLOR=never + sed 兜底剥离 ANSI。
        env:
          CARGO_TERM_COLOR: never
          # 本 job 只做 cargo check（不打包），无需 sidecar 二进制。
          # 但 build.rs 会校验 bundle.externalBin 指向的文件是否存在，缺失即报
          #   path matching binaries/kb-mcp-aarch64-unknown-linux-gnu not found.
          # 用 TAURI_CONFIG 局部覆盖成空数组即可跳过该校验（JSON 浅合并，
          # 不影响其余配置）。真正打包时由 release.yml 先 pnpm build:mcp 生成。
          TAURI_CONFIG: '{"tauri":{"bundle":{"externalBin":[]}}}'
          # 曾经这里还设过 TAURI_ENV_TARGET_TRIPLE=aarch64-unknown-linux-gnu，
          # 并附注"tauri 宏编译期需要它"——那个归因是错的。真实情况：
          # 读它的是项目自己的 src/commands/mcp.rs（env! 拼 sidecar 文件名），
          # 且 tauri CLI 注入的名字是 TAURI_TARGET_TRIPLE（另一个变量）。
          # 现已改为 build.rs 用 cargo:rustc-env 转发 TARGET → KB_TARGET_TRIPLE，
          # 全路径（cargo check / cargo build / tauri build）无需任何环境变量。
        run: |
          set +e
          cargo check --all-targets > /tmp/check.log 2>&1
          STATUS=$?
          set -e

          # 兜底剥离 ANSI 转义序列（即使环境变量被上层覆盖也能正确 grep）
          sed -i 's/\x1b\[[0-9;]*[a-zA-Z]//g' /tmp/check.log

          echo "===== cargo check 退出码: ${STATUS} ====="
          echo "===== error 行数: $(grep -c '^error' /tmp/check.log || true) ====="
          echo ""
          echo "===== 错误详情（每条带 10 行上下文，最多 260 行）====="
          grep -E -A10 '^error(\[E[0-9]+\])?:' /tmp/check.log | head -260 || true
          echo ""
          echo "===== 错误摘要（按错误码去重）====="
          grep -oE '^error\[E[0-9]+\]' /tmp/check.log | sort | uniq -c | sort -rn | head -30 || true
          echo ""
          echo "===== 出错文件清单（按文件聚合）====="
          grep -oE '^\s+--> [^:]+' /tmp/check.log | sed 's/.*--> //' | sort | uniq -c | sort -rn | head -30 || true
          exit ${STATUS}

      - name: Upload full check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-check-log
          path: /tmp/check.log
          retention-days: 3
          if-no-files-found: ignore
